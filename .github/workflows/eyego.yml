# EyeGo: ONE Claude agent drives the rider app (iPhone SE) and the driver app
# (iPhone 16 Pro) side by side, against a fresh backend on the same Mac.
#   gh workflow run eyego.yml -f run=core-ride
# Results are encrypted with your key: bash scripts/collect.sh <run id>
name: EyeGo agent test

on:
  workflow_dispatch:
    inputs:
      run:
        description: Which scenario brief (briefs/eyego-<run>.md)
        type: choice
        # smoke = launch both apps + collect logs/crashes, no agent (no Claude usage)
        options: [core-ride, things-wrong, group, smoke]   # money, profile-sweep: briefs come later
        default: core-ride
      model:
        description: opus or sonnet
        type: choice
        options: [opus, sonnet]
        default: opus
      ref:
        description: EyeGo-V2 branch or SHA to test
        default: main
      apps_from_run:
        description: Reuse both apps from this earlier run id (skips the ~35 min build). Empty = build.
        default: ''

jobs:
  build-rider:
    if: inputs.apps_from_run == ''
    uses: SpencerGeee/EyeGo-V2/.github/workflows/ios-sideload.yml@main
    with: { app: rider, sdk: iphonesimulator, ref: "${{ inputs.ref }}" }
  build-driver:
    if: inputs.apps_from_run == ''
    uses: SpencerGeee/EyeGo-V2/.github/workflows/ios-sideload.yml@main
    with: { app: driver, sdk: iphonesimulator, ref: "${{ inputs.ref }}" }

  test:
    needs: [build-rider, build-driver]
    if: ${{ !cancelled() && !failure() }}   # runs when the builds are skipped too
    runs-on: macos-15
    timeout-minutes: 240
    env:
      RUN: ${{ inputs.run }}
      MODEL: ${{ inputs.model }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: SpencerGeee/EyeGo-V2, ref: "${{ inputs.ref }}", path: eyego }
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-sim-app"
          path: dl
          run-id: ${{ inputs.apps_from_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Unzip apps
        run: for a in rider driver; do mkdir -p app/$a && unzip -q dl/$a-sim-app/$a-sim.zip -d app/$a; done
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
      - name: Tools (AXe, Pillow, Claude Code)
        run: |
          brew install -q cameroncooke/axe/axe
          python3 -m pip install -q --break-system-packages pillow
          npm install -g --silent @anthropic-ai/claude-code
      - name: Backend (Postgres, Redis, API)
        env:
          MAPBOX_SECRET_TOKEN: ${{ secrets.MAPBOX_SECRET_TOKEN }}
          MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: bash scripts/eyego/backend.sh
      - name: Seed driver
        run: node scripts/eyego/seed.mjs
      - name: Agent
        timeout-minutes: ${{ inputs.run == 'smoke' && 12 || 225 }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: EYEGO_TMP="$RUNNER_TEMP/eyego" && mkdir -p "$EYEGO_TMP" && EYEGO_TMP="$EYEGO_TMP" bash scripts/eyego/run_agent.sh
      - name: Collect crash reports
        if: always()
        run: |
          mkdir -p "results/$RUN/crashes"
          find ~/Library/Logs/DiagnosticReports -name 'EyeGo*.ips' -exec cp {} "results/$RUN/crashes/" \; 2>/dev/null || true
          echo "crash reports: $(find "results/$RUN/crashes" -name '*.ips' | wc -l)"
      - name: Encrypt results
        if: always()
        run: bash scripts/encrypt_results.sh "eyego-$RUN"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "results-eyego-${{ inputs.run }}", path: results.enc/, retention-days: 14 }
